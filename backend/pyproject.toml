[project]
name = "growth-os-backend"
version = "0.2.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette nudges towards httpx2 for its TestClient; not relevant to app behaviour.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
