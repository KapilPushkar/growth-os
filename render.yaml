# Optional: host a public demo on Render (https://render.com) from this repo.
# New + > Blueprint > select the repo. The free plan sleeps when idle and
# reloads fresh demo data on every start.
services:
  - type: web
    name: growth-os
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
